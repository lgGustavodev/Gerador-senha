<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pssaword Generator</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="src/styles/styles.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
        />
    </head>
    <body>
        <main>
            <div id="container">
                <img id="img" src="src/img/cadeado (5).png" alt="" />
                <h1 id="title">Gerar Senha</h1>

                <div id="password_container">
                    <span id="password"></span>
                    <button id="copy"><i class="fa-solid fa-copy"></i></button>
                </div>

                <div id="password_items">
                    <div class="item">
                        <input id="size" name="size" type="number" />
                        <label for="size">Quantidades de caracteres </label>
                    </div>
                    <div id="item">
                        <input
                            type="checkbox"
                            name="include_uppercase"
                            id="include_uppercase"
                        />
                        <label for="include_uppercase"
                            >Incluir letra maiúscula</label
                        >
                    </div>

                    <div id="item">
                        <input
                            type="checkbox"
                            name="include_lowercase"
                            id="include_lowercase"
                        />
                        <label for="include_lowercase"
                            >Incluir letra minúscula</label
                        >
                    </div>

                    <div id="item">
                        <input
                            type="checkbox"
                            name="include_number"
                            id="include_number"
                        />
                        <label for="include_number">Incluir número</label>
                    </div>

                    <div id="item">
                        <input
                            type="checkbox"
                            name="include_special_character"
                            id="include_special_character"
                        />
                        <label for="include_special_character"
                            >Incluir caractere especial</label
                        >
                    </div>
                    <button id="generate">Gerar senha</button>
                </div>
            </div>
        </main>
        <script src="src/javascript/script.js"></script>
        <script
            type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/toastify-js"
        ></script>
    </body>
</html>
